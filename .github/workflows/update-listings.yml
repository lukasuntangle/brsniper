name: Daily Listings Update

on:
  schedule:
    # Run at 6:00 AM UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-listings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts || true

      - name: Fetch new listings from RSS feeds
        run: node scripts/fetch-listings.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch funded startups from RSS feeds
        run: node scripts/fetch-funded-startups.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "Auto-update: New listings and funded startups [$(date +'%Y-%m-%d')]"
          git push

      - name: Create issue with digest
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const digest = JSON.parse(fs.readFileSync('data/digest.json', 'utf8'));

            let fundedDigest = { newStartups: [] };
            try {
              fundedDigest = JSON.parse(fs.readFileSync('data/funded-digest.json', 'utf8'));
            } catch (e) {}

            if (digest.newListings.length === 0 && digest.manualReviewLinks.length === 0 && fundedDigest.newStartups.length === 0) {
              console.log('No new items to report');
              return;
            }

            let body = '## Daily Digest\n\n';
            body += `**Date:** ${new Date().toISOString().split('T')[0]}\n\n`;

            if (digest.newListings.length > 0) {
              body += '### New Listings Added Automatically\n\n';
              digest.newListings.forEach(l => {
                body += `- **${l.title}** (${l.source}) - ${l.revenue || 'Revenue TBD'}\n`;
              });
              body += '\n';
            }

            if (fundedDigest.newStartups.length > 0) {
              body += '### New Funded Startups\n\n';
              fundedDigest.newStartups.forEach(s => {
                body += `- **${s.company}** (${s.round}) - ${s.amount} - ${s.industry} - Copyability: ${s.copyability}/5\n`;
              });
              body += '\n';
            }

            body += '### Manual Review Needed\n\n';
            body += 'Check these sources for new opportunities:\n\n';
            digest.manualReviewLinks.forEach(link => {
              body += `- [${link.name}](${link.url})\n`;
            });

            body += '\n---\n';
            body += '_This issue was auto-generated. Close when reviewed._';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Daily Digest - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['digest', 'automated']
            });
